# Production: MySQL. Schema is managed deliberately, not generated at startup.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/estateops}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
