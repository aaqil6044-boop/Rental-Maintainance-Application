<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept invitation — EstateOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 22px}
  .box{width:100%;max-width:440px}
  .box .wordmark{margin-bottom:26px}
  .facts{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-panel);padding:14px 16px;margin:18px 0 6px;font-size:14px;display:grid;grid-template-columns:110px 1fr;gap:6px 12px}
  .facts dt{color:var(--slate-2);font-size:13px}
  .box form{display:flex;flex-direction:column;gap:16px;margin-top:18px}
</style>
</head>
<body>
<div class="center"><div class="box">
  <a class="wordmark" href="index.html">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="2.5" stroke="#1C5546" stroke-width="1.6"/><path d="M7 7h4v4H7zM13 7h4v4h-4zM7 13h4v4H7z" fill="#1C5546"/><path d="M13 13h4v4h-4z" fill="#B2500C"/></svg>
    EstateOps
  </a>
  <h1 id="title" style="font-size:26px">Checking your invitation…</h1>
  <p class="say" id="blurb" style="color:var(--slate);margin-top:6px"></p>
  <dl class="facts" id="facts" hidden></dl>
  <form id="form" hidden novalidate>
    <div id="nameRow"><label for="name">Full name</label><input id="name" class="field" autocomplete="name"></div>
    <div id="phoneRow"><label for="phone">Phone <span class="opt">(optional)</span></label><input id="phone" class="field" autocomplete="tel"></div>
    <div id="skillsRow" hidden><label for="skills">Skills or trades <span class="opt">(optional)</span></label><input id="skills" class="field" placeholder="For example: plumbing, electrical"></div>
    <div><label for="pw">Choose a password</label><input id="pw" class="field" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
    <p class="alert" id="err" role="alert"></p>
    <button class="btn btn--block" id="submit" type="submit">Create my account</button>
  </form>
  <p class="alert" id="bad" role="alert" style="margin-top:18px"></p>
  <p style="margin-top:22px;font-size:14px"><a href="login.html" style="color:var(--pine);text-decoration:underline">Go to sign in</a></p>
</div></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('token') || '';
  var info = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  var ROLE = { TENANT: 'tenant', MANAGER: 'manager', TECHNICIAN: 'technician', VENDOR: 'vendor' };

  fetch('/api/invitations/lookup?token=' + encodeURIComponent(token)).then(function (r) {
    return r.json().then(function (d) { if (!r.ok) throw new Error(d.message); return d; });
  }).then(function (d) {
    info = d;
    var reset = d.kind === 'RESET';
    $('title').textContent = reset ? 'Choose a new password' : 'Join ' + d.organizationName;
    $('blurb').textContent = reset ? 'Set a new password for your account.' : 'You were invited as a ' + ROLE[d.role] + '. Finish setting up your account.';
    var rows = '<dt>Email</dt><dd>' + esc(d.email) + '</dd>';
    if (!reset) {
      rows += '<dt>Organization</dt><dd>' + esc(d.organizationName) + '</dd><dt>Role</dt><dd>' + esc(ROLE[d.role]) + '</dd>';
      if (d.vendorName) rows += '<dt>Company</dt><dd>' + esc(d.vendorName) + '</dd>';
      if (d.unit) rows += '<dt>Unit</dt><dd>' + esc(d.unit) + '</dd>';
    }
    $('facts').innerHTML = rows; $('facts').hidden = false;
    $('nameRow').hidden = reset; $('phoneRow').hidden = reset;
    $('skillsRow').hidden = reset || d.role !== 'TECHNICIAN';
    $('submit').textContent = reset ? 'Save new password' : 'Create my account';
    $('form').hidden = false; $('bad').textContent = '';
  }).catch(function (e) {
    $('title').textContent = 'This link does not work';
    $('bad').textContent = (e && e.message) || 'This invitation link is not valid or has expired.';
    $('blurb').textContent = 'Ask your manager to send you a new one.';
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault(); $('err').textContent = '';
    var reset = info.kind === 'RESET';
    if (!reset && !$('name').value.trim()) { $('err').textContent = 'Enter your full name.'; return; }
    if ($('pw').value.length < 8) { $('err').textContent = 'Use at least 8 characters for your password.'; return; }
    $('submit').disabled = true;
    fetch('/api/invitations/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, fullName: $('name').value.trim(), phone: $('phone').value.trim(),
                             skills: $('skills').value.trim(), password: $('pw').value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.message); return d; }); })
      .then(function (d) { try { localStorage.setItem('eo_auth', JSON.stringify(d)); } catch (x) {} location.href = 'app.html'; })
      .catch(function (x) { $('err').textContent = x.message; $('submit').disabled = false; });
  });
})();
</script>
</body>
</html>
